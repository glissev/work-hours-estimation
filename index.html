<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly hours estimator</title>
<meta name="description" content="Estimate your working hours and earnings for any calendar month.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E6E8E1;
    --sheet:#FBFBF8;
    --ink:#182420;
    --ink-2:#5C6A63;
    --ink-3:#8B978F;
    --rule:#D3D8CD;
    --rule-soft:#E4E7DE;
    --teal:#12605A;
    --brass:#8F6416;
    --off:#F1F2EC;
    --focus:#12605A;
    --radius:3px;
    --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    font-feature-settings:"tnum" 1,"lnum" 1;
    padding:clamp(12px,3vw,40px);
    display:flex;
    justify-content:center;
  }
  .sheet{
    width:100%;
    max-width:940px;
    background:var(--sheet);
    border:1px solid var(--rule);
    border-radius:var(--radius);
  }

  /* masthead ------------------------------------------------ */
  .masthead{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding:clamp(18px,3vw,28px);
    border-bottom:1px solid var(--rule);
  }
  .period{display:flex;align-items:center;gap:10px}
  .period h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.55rem,4.5vw,2.1rem);
    line-height:1.1;
    margin:0;
    letter-spacing:-.01em;
  }
  .period h1 .yr{color:var(--ink-3);font-weight:400}
  .step{
    appearance:none;
    width:34px;height:34px;
    flex:none;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:transparent;
    color:var(--ink-2);
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .step:hover{background:var(--off);color:var(--ink)}
  .picker{display:flex;gap:6px;align-items:center;margin-left:4px}
  .rate{display:flex;flex-direction:column;gap:6px}
  .rate label{font-size:.8rem;color:var(--ink-2)}
  .rate-field{
    display:flex;align-items:stretch;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:#fff;
    overflow:hidden;
  }
  .rate-field input{
    width:92px;
    border:0;
    padding:8px 10px;
    font:inherit;
    font-family:var(--serif);
    font-size:1.05rem;
    text-align:right;
    background:transparent;
    color:var(--ink);
  }
  .rate-field select{
    border:0;
    border-left:1px solid var(--rule-soft);
    background:var(--off);
    padding:0 8px;
    font:inherit;
    font-size:.85rem;
    color:var(--ink-2);
    cursor:pointer;
  }
  .picker select,.picker input{
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:#fff;
    padding:7px 8px;
    font:inherit;
    font-size:.85rem;
    color:var(--ink-2);
  }
  .picker input{width:72px;text-align:center}
  input:focus-visible,select:focus-visible,button:focus-visible,[role="button"]:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .lede{
    margin:0;
    padding:14px clamp(18px,3vw,28px);
    font-size:.88rem;
    color:var(--ink-2);
    max-width:64ch;
  }

  /* calendar ------------------------------------------------ */
  .calendar{padding:0 clamp(10px,3vw,28px) clamp(18px,3vw,28px)}
  .row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .head{border-bottom:1px solid var(--ink);margin-bottom:-1px}
  .col{
    padding:10px 6px 12px;
    text-align:center;
    border-left:1px solid var(--rule-soft);
  }
  .col:first-child{border-left:0}
  .col.rest{background:var(--off)}
  .col .name{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:6px}
  .col .name .long{display:inline}
  .col .name .short{display:none}
  .col input{
    width:100%;
    max-width:64px;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:#fff;
    padding:6px 4px;
    font-family:var(--serif);
    font-size:1rem;
    text-align:center;
    color:var(--teal);
  }
  .col input:hover{border-color:var(--ink-3)}
  .col .tally{
    display:block;
    margin-top:6px;
    font-size:.72rem;
    color:var(--ink-3);
    min-height:1em;
  }

  .day{
    position:relative;
    border-left:1px solid var(--rule-soft);
    border-bottom:1px solid var(--rule-soft);
    background:none;
    font:inherit;
    color:inherit;
    text-align:left;
    padding:8px 8px 10px;
    min-height:64px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
  }
  .day:first-child{border-left:0}
  .grid .row:last-child .day{border-bottom:0}
  .day.pad{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--off) 6px 7px)}
  .day.rest{background:var(--off)}
  .day:not(.pad):hover{background:#EDF1EA}
  .day .date{font-size:.84rem;color:var(--ink-2)}
  .day .hrs{
    align-self:flex-end;
    font-family:var(--serif);
    font-size:1.02rem;
    color:var(--teal);
  }
  .day.zero .hrs{color:var(--ink-3)}
  .day.today .date{
    font-weight:600;color:var(--ink);
    box-shadow:0 1px 0 0 var(--ink);
  }
  .day.skipped .date,.day.skipped .hrs{color:var(--ink-3);text-decoration:line-through}
  .day.skipped::after{
    content:"skipped";
    position:absolute;left:8px;bottom:9px;
    font-size:.66rem;color:var(--ink-3);
  }

  /* totals -------------------------------------------------- */
  .totals{
    border-top:1px solid var(--ink);
    padding:clamp(18px,3vw,28px);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:22px 32px;
    align-items:end;
  }
  .figure .k{display:block;font-size:.82rem;color:var(--ink-2);margin-bottom:2px}
  .figure .v{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.9rem,6vw,2.6rem);
    line-height:1.05;
    letter-spacing:-.015em;
    display:block;
  }
  .figure .v .unit{font-size:.44em;font-weight:400;color:var(--ink-2);margin-left:.35em}
  .figure.hours .v{color:var(--teal)}
  .figure.money .v{color:var(--brass)}
  .figure .sub{display:block;margin-top:4px;font-size:.82rem;color:var(--ink-2)}
  .breakdown{
    grid-column:1/-1;
    border-top:1px solid var(--rule-soft);
    padding-top:14px;
    margin:0;
    display:flex;
    flex-wrap:wrap;
    gap:4px 22px;
    font-size:.84rem;
    color:var(--ink-2);
  }
  .breakdown li{list-style:none}
  .breakdown b{font-weight:500;color:var(--ink)}
  .breakdown .none{color:var(--ink-3)}
  .reset{
    background:none;border:0;padding:0;
    font:inherit;font-size:.84rem;
    color:var(--ink-2);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .reset:hover{color:var(--ink)}

  @media (max-width:620px){
    .masthead{padding:16px 14px;gap:14px}
    .period{width:100%;justify-content:space-between}
    .picker{margin-left:0}
    .rate{width:100%}
    .rate-field{width:100%}
    .rate-field input{flex:1;width:auto}
    .lede{padding:12px 14px;font-size:.84rem}
    .calendar{padding:0 8px 18px}
    .col{padding:8px 2px 10px}
    .col .name .long{display:none}
    .col .name .short{display:inline}
    .col input{font-size:.92rem;padding:5px 2px}
    .col .tally{font-size:.66rem}
    .day{min-height:54px;padding:5px 4px 7px}
    .day .date{font-size:.76rem}
    .day .hrs{font-size:.88rem}
    .day.skipped::after{display:none}
    .totals{padding:18px 14px;gap:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main class="sheet">
  <header class="masthead">
    <div class="period">
      <button class="step" id="prev" type="button" aria-label="Previous month">&lsaquo;</button>
      <h1 id="title">—</h1>
      <div class="picker">
        <label class="sr" for="monthSel" hidden>Month</label>
        <select id="monthSel" aria-label="Month"></select>
        <label class="sr" for="yearInp" hidden>Year</label>
        <input id="yearInp" type="number" min="1970" max="2999" step="1" aria-label="Year">
      </div>
      <button class="step" id="next" type="button" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="rate">
      <label for="rateInp">Hourly rate</label>
      <div class="rate-field">
        <input id="rateInp" type="number" min="0" step="0.01" inputmode="decimal">
        <select id="curSel" aria-label="Currency">
          <option>BGN</option><option>EUR</option><option>USD</option>
          <option>GBP</option><option>CHF</option><option>RON</option>
        </select>
      </div>
    </div>
  </header>

  <p class="lede">Set the hours you expect to work on each weekday in the column headings. Click a date to skip it — a holiday, leave, a day off.</p>

  <section class="calendar">
    <div class="row head" id="weekHead"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="totals" aria-live="polite">
    <p class="figure hours">
      <span class="k">Estimated hours</span>
      <span class="v" id="totalHours">0<span class="unit">h</span></span>
      <span class="sub" id="daysSub">—</span>
    </p>
    <p class="figure money">
      <span class="k">Estimated total</span>
      <span class="v" id="totalPay">—</span>
      <span class="sub" id="rateSub">—</span>
    </p>
    <ul class="breakdown" id="breakdown"></ul>
    <p style="grid-column:1/-1;margin:0"><button class="reset" id="reset" type="button">Reset to a standard 8-hour week</button></p>
  </section>
</main>

<script>
(function(){
  "use strict";

  var DAY_LONG  = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  var DAY_ABBR  = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var DAY_MIN   = ["M","T","W","T","F","S","S"];
  var MONTHS    = ["January","February","March","April","May","June",
                   "July","August","September","October","November","December"];
  var KEY = "hours-estimator/v1";
  var DEFAULT_HOURS = [8,8,8,8,8,0,0];

  var now = new Date();
  var state = {
    year: now.getFullYear(),
    month: now.getMonth(),
    hours: DEFAULT_HOURS.slice(),
    rate: 25,
    currency: "BGN",
    skips: {}
  };

  /* ---------- storage (best effort) ---------- */
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        hours: state.hours, rate: state.rate,
        currency: state.currency, skips: state.skips
      }));
    }catch(e){ /* private mode, quota, file:// — carry on */ }
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var s = JSON.parse(raw);
      if(Array.isArray(s.hours) && s.hours.length === 7){
        state.hours = s.hours.map(function(h){ return clampHours(h); });
      }
      if(typeof s.rate === "number" && isFinite(s.rate) && s.rate >= 0) state.rate = s.rate;
      if(typeof s.currency === "string") state.currency = s.currency;
      if(s.skips && typeof s.skips === "object") state.skips = s.skips;
    }catch(e){ /* ignore unreadable state */ }
  }

  /* ---------- helpers ---------- */
  function clampHours(v){
    var n = parseFloat(v);
    if(!isFinite(n) || n < 0) n = 0;
    if(n > 24) n = 24;
    return Math.round(n * 100) / 100;
  }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  // 0 = Monday … 6 = Sunday
  function weekdayIndex(y,m,d){ return (new Date(y,m,d).getDay() + 6) % 7; }
  function iso(y,m,d){
    return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  }
  function fmtHours(n){
    var r = Math.round(n * 100) / 100;
    return (r % 1 === 0) ? String(r) : r.toFixed(2).replace(/0$/,"");
  }
  function fmtMoney(n){
    try{
      return new Intl.NumberFormat(undefined,{
        style:"currency", currency:state.currency,
        minimumFractionDigits:2, maximumFractionDigits:2
      }).format(n);
    }catch(e){
      return n.toFixed(2) + " " + state.currency;
    }
  }

  /* ---------- elements ---------- */
  var el = {
    title: document.getElementById("title"),
    monthSel: document.getElementById("monthSel"),
    yearInp: document.getElementById("yearInp"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    rateInp: document.getElementById("rateInp"),
    curSel: document.getElementById("curSel"),
    weekHead: document.getElementById("weekHead"),
    grid: document.getElementById("grid"),
    totalHours: document.getElementById("totalHours"),
    totalPay: document.getElementById("totalPay"),
    daysSub: document.getElementById("daysSub"),
    rateSub: document.getElementById("rateSub"),
    breakdown: document.getElementById("breakdown"),
    reset: document.getElementById("reset")
  };

  MONTHS.forEach(function(name,i){
    var o = document.createElement("option");
    o.value = i; o.textContent = name;
    el.monthSel.appendChild(o);
  });

  /* ---------- the week header: inputs live here ---------- */
  var hourInputs = [];

  // One call per weekday, so `col` and `inp` belong to this column alone.
  // Declaring them in a shared loop makes every handler talk to the last input.
  function buildHeadCol(idx){
    var col = document.createElement("div");
    col.className = "col" + (idx > 4 ? " rest" : "");

    var name = document.createElement("span");
    name.className = "name";
    name.innerHTML = '<span class="long">' + DAY_ABBR[idx] + '</span>' +
                     '<span class="short">' + DAY_MIN[idx] + '</span>';
    col.appendChild(name);

    var inp = document.createElement("input");
    inp.type = "number";
    inp.min = "0"; inp.max = "24"; inp.step = "0.25";
    inp.inputMode = "decimal";
    inp.setAttribute("aria-label","Hours worked on each " + DAY_LONG[idx]);
    inp.addEventListener("input", function(e){
      state.hours[idx] = clampHours(e.target.value);
      save(); render();
    });
    inp.addEventListener("blur", function(e){
      e.target.value = fmtHours(state.hours[idx]);
    });
    col.appendChild(inp);
    hourInputs[idx] = inp;

    var tally = document.createElement("span");
    tally.className = "tally";
    col.appendChild(tally);

    el.weekHead.appendChild(col);
  }

  for(var w0 = 0; w0 < 7; w0++) buildHeadCol(w0);

  /* ---------- month math ---------- */
  function compute(){
    var total = 0, workedDays = 0, skipped = 0;
    var perWeekday = [];
    for(var i = 0; i < 7; i++) perWeekday.push({count:0, hours:0});

    var n = daysInMonth(state.year, state.month);
    for(var d = 1; d <= n; d++){
      var wd = weekdayIndex(state.year, state.month, d);
      var isSkipped = !!state.skips[iso(state.year, state.month, d)];
      var h = isSkipped ? 0 : state.hours[wd];
      if(isSkipped && state.hours[wd] > 0) skipped++;
      if(!isSkipped){
        perWeekday[wd].count++;
        perWeekday[wd].hours += h;
      }
      if(h > 0) workedDays++;
      total += h;
    }
    return {
      total: Math.round(total * 100) / 100,
      workedDays: workedDays,
      skipped: skipped,
      perWeekday: perWeekday,
      daysInMonth: n
    };
  }

  /* ---------- render ---------- */
  function render(){
    el.title.innerHTML = MONTHS[state.month] + ' <span class="yr">' + state.year + '</span>';
    el.monthSel.value = String(state.month);
    if(document.activeElement !== el.yearInp) el.yearInp.value = state.year;
    if(document.activeElement !== el.rateInp) el.rateInp.value = state.rate;
    el.curSel.value = state.currency;

    var r = compute();

    for(var i = 0; i < 7; i++){
      if(document.activeElement !== hourInputs[i]){
        hourInputs[i].value = fmtHours(state.hours[i]);
      }
      var tally = el.weekHead.children[i].querySelector(".tally");
      tally.textContent = r.perWeekday[i].count ? "× " + r.perWeekday[i].count : "";
    }

    // day grid
    el.grid.innerHTML = "";
    var lead = weekdayIndex(state.year, state.month, 1);
    var cells = lead + r.daysInMonth;
    var rows = Math.ceil(cells / 7);
    var today = new Date();
    var todayIso = iso(today.getFullYear(), today.getMonth(), today.getDate());

    var cursor = 0;
    for(var row = 0; row < rows; row++){
      var rowEl = document.createElement("div");
      rowEl.className = "row";
      for(var col = 0; col < 7; col++, cursor++){
        var dayNum = cursor - lead + 1;
        if(dayNum < 1 || dayNum > r.daysInMonth){
          var pad = document.createElement("div");
          pad.className = "day pad";
          pad.setAttribute("aria-hidden","true");
          rowEl.appendChild(pad);
          continue;
        }
        rowEl.appendChild(buildDay(dayNum, col, todayIso));
      }
      el.grid.appendChild(rowEl);
    }

    // totals
    el.totalHours.innerHTML = fmtHours(r.total) + '<span class="unit">h</span>';
    el.totalPay.textContent = fmtMoney(r.total * state.rate);

    var sub = r.workedDays + (r.workedDays === 1 ? " working day" : " working days");
    if(r.workedDays) sub += " · " + fmtHours(Math.round(r.total / r.workedDays * 100) / 100) + "h a day on average";
    if(r.skipped) sub += " · " + r.skipped + " skipped";
    el.daysSub.textContent = sub;
    el.rateSub.textContent = fmtMoney(state.rate) + " an hour";

    // per-weekday breakdown
    el.breakdown.innerHTML = "";
    var any = false;
    for(var w = 0; w < 7; w++){
      if(state.hours[w] <= 0 || r.perWeekday[w].hours <= 0) continue;
      any = true;
      var li = document.createElement("li");
      li.innerHTML = DAY_ABBR[w] + " " + r.perWeekday[w].count + " × " +
                     fmtHours(state.hours[w]) + "h = <b>" +
                     fmtHours(r.perWeekday[w].hours) + "h</b>";
      el.breakdown.appendChild(li);
    }
    if(!any){
      var empty = document.createElement("li");
      empty.className = "none";
      empty.textContent = "No hours set yet — add some above and the month fills in.";
      el.breakdown.appendChild(empty);
    }
  }

  function buildDay(dayNum, col, todayIso){
    var key = iso(state.year, state.month, dayNum);
    var wd = weekdayIndex(state.year, state.month, dayNum);
    var isSkipped = !!state.skips[key];
    var h = isSkipped ? 0 : state.hours[wd];

    var cell = document.createElement("button");
    cell.type = "button";
    cell.className = "day" +
      (col > 4 ? " rest" : "") +
      (h > 0 ? "" : " zero") +
      (isSkipped ? " skipped" : "") +
      (key === todayIso ? " today" : "");
    cell.setAttribute("aria-pressed", isSkipped ? "true" : "false");
    cell.setAttribute("aria-label",
      DAY_LONG[wd] + " " + dayNum + " " + MONTHS[state.month] +
      ", " + (isSkipped ? "skipped" : fmtHours(h) + " hours") + ". Click to " +
      (isSkipped ? "restore" : "skip") + ".");

    var date = document.createElement("span");
    date.className = "date";
    date.textContent = dayNum;
    cell.appendChild(date);

    var hrs = document.createElement("span");
    hrs.className = "hrs";
    hrs.textContent = h > 0 ? fmtHours(h) + "h" : "–";
    cell.appendChild(hrs);

    cell.addEventListener("click", function(){
      if(state.skips[key]) delete state.skips[key];
      else state.skips[key] = 1;
      save(); render();
    });
    return cell;
  }

  /* ---------- controls ---------- */
  function shiftMonth(delta){
    var d = new Date(state.year, state.month + delta, 1);
    state.year = d.getFullYear();
    state.month = d.getMonth();
    render();
  }
  el.prev.addEventListener("click", function(){ shiftMonth(-1); });
  el.next.addEventListener("click", function(){ shiftMonth(1); });
  el.monthSel.addEventListener("change", function(){
    state.month = parseInt(el.monthSel.value, 10) || 0;
    render();
  });
  el.yearInp.addEventListener("input", function(){
    var y = parseInt(el.yearInp.value, 10);
    if(y >= 1970 && y <= 2999){ state.year = y; render(); }
  });
  el.rateInp.addEventListener("input", function(){
    var v = parseFloat(el.rateInp.value);
    state.rate = (isFinite(v) && v >= 0) ? v : 0;
    save(); render();
  });
  el.curSel.addEventListener("change", function(){
    state.currency = el.curSel.value;
    save(); render();
  });
  el.reset.addEventListener("click", function(){
    state.hours = DEFAULT_HOURS.slice();
    state.skips = {};
    save(); render();
  });
  document.addEventListener("keydown", function(e){
    if(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(e.key === "ArrowLeft") shiftMonth(-1);
    if(e.key === "ArrowRight") shiftMonth(1);
  });

  load();
  render();
})();
</script>
</body>
</html>
